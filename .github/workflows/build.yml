name: Build Sailfish OS RPM

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build RPM (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ aarch64, armv7hl, i486 ]
        release: [ "4.5.0.16" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build RPM with Sailfish Action
        uses: coderus/github-sfos-build@master
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}

      - name: Upload RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harbour-sailfish-horizon-${{ matrix.arch }}
          path: RPMS/*.rpm
          if-no-files-found: warn

  release:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all built RPMs
        uses: actions/download-artifact@v4
        with:
          path: all-rpms
          merge-multiple: true

      - name: Publish to GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest Build (Rolling)' }}
          body: |
            Automated Sailfish OS build for **harbour-sailfish-horizon**.

            ### Available Assets:
            * **`aarch64`**: Modern 64-bit devices (Jolla 2026 / C2, Sony Xperia 10 II / III / IV / V)
            * **`armv7hl`**: 32-bit ARM devices (Xperia X, Jolla 1, Jolla C)
            * **`i486`**: Sailfish OS PC Emulator
          files: all-rpms/*.rpm
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
