name: Sailfish emulator experiment

on:
  push:
    branches: [ "copilot/sailfish-emulator-test" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build i486 RPM
        uses: coderus/github-sfos-build@master
        with:
          release: "4.5.0.16"
          arch: i486

      - name: Install VirtualBox
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-headers-$(uname -r)" libxcb-xinerama0 libegl1 libgl1
          curl --fail --location --retry 3 \
            'https://download.virtualbox.org/virtualbox/7.2.22/virtualbox-7.2_7.2.22-175245~Ubuntu~noble_amd64.deb' \
            --output /tmp/virtualbox.deb
          echo '426f192dc4515cd02a687a39408c0b6b0d7741de77ff7c345efd92e6090c96ee  /tmp/virtualbox.deb' | sha256sum --check
          sudo apt-get install -y /tmp/virtualbox.deb
          sudo modprobe vboxdrv
          VBoxManage --version
          test -e /dev/vboxdrv

      - name: Install Sailfish SDK and emulator
        run: |
          curl --fail --location --retry 3 \
            https://releases.sailfishos.org/sdk/installers/3.13.5/SailfishSDK-3.13.5-linux64-offline.run \
            --output /tmp/sailfish-sdk-installer
          chmod +x /tmp/sailfish-sdk-installer
          QT_QPA_PLATFORM=minimal /tmp/sailfish-sdk-installer \
            non-interactive=1 accept-licenses=1 build-engine-type=vbox
          "$HOME/SailfishOS/bin/sfdk" emulator --help
          VBoxManage list vms

      - name: Start emulator
        run: |
          mapfile -t vms < <(VBoxManage list vms | sed -n 's/^"\(SailfishOS-[^"]*\)".*/\1/p')
          if [ "${#vms[@]}" -ne 1 ]; then
            echo "Expected exactly one Sailfish emulator, found ${#vms[@]}" >&2
            exit 1
          fi
          echo "SAILFISH_VM=${vms[0]}" >> "$GITHUB_ENV"
          if ! VBoxManage startvm "${vms[0]}" --type headless; then
            VBoxManage showvminfo "${vms[0]}" --log 0 | tail -100
            exit 1
          fi
          for attempt in 1 2 3 4; do
            if "$HOME/SailfishOS/bin/sfdk" emulator exec true; then
              exit 0
            fi
            echo "Emulator SSH not ready (attempt $attempt); retrying." >&2
            sleep 10
          done
          echo "Emulator SSH did not become ready." >&2
          exit 1

      - name: Install and launch the app
        run: |
          set -o pipefail
          mkdir -p diagnostics
          mapfile -t rpms < <(find RPMS -type f -name '*i486.rpm' ! -name '*debug*.rpm')
          if [ "${#rpms[@]}" -ne 1 ]; then
            echo "Expected exactly one i486 RPM, found ${#rpms[@]}" >&2
            exit 1
          fi
          key="$HOME/SailfishOS/vmshare/ssh/private_keys/sdk"
          scp -P 2223 -i "$key" -o StrictHostKeyChecking=accept-new \
            "${rpms[0]}" defaultuser@127.0.0.1:/tmp/horizon.i486.rpm
          ssh -p 2223 -i "$key" -o StrictHostKeyChecking=accept-new \
            root@127.0.0.1 'pkcon --noninteractive --allow-untrusted install-local /tmp/horizon.i486.rpm'
          (
            set +e
            ssh -p 2223 -i "$key" -o StrictHostKeyChecking=accept-new \
              defaultuser@127.0.0.1 \
              'XDG_RUNTIME_DIR=/run/user/$(id -u) WAYLAND_DISPLAY=wayland-0 timeout 30s /usr/bin/harbour-sailfish-horizon' \
              2>&1 | tee diagnostics/startup.log
            exit "${PIPESTATUS[0]}"
          ) &
          app_pid=$!
          sleep 15
          VBoxManage controlvm "$SAILFISH_VM" screenshotpng diagnostics/screen.png
          set +e
          wait "$app_pid"
          app_status=$?
          set -e
          if [ "$app_status" -ne 124 ]; then
            echo "Application exited before the 30-second timeout (status $app_status)." >&2
            exit 1
          fi
          if grep -Ei '(^|[[:space:]])(error|fatal):|type .* unavailable|cannot assign to non-existent|module .* is not installed' diagnostics/startup.log; then
            echo "Startup errors found; see startup.log." >&2
            exit 1
          fi
          echo "No startup error detected; this does not verify the rendered page."

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sailfish-emulator-diagnostics
          path: diagnostics/
          if-no-files-found: warn
